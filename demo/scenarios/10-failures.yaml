# Five broken workloads, one failure mode each. Nothing here needs cloud resources.
---
# 1. CrashLoopBackOff: the application exits because a required variable is missing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "starting checkout service"
              if [ -z "$PAYMENT_API_URL" ]; then
                echo "FATAL: environment variable PAYMENT_API_URL is not set" >&2
                exit 1
              fi
              sleep 3600
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
---
# 2. OOMKilled: the process allocates far more memory than its limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: cache }
  template:
    metadata:
      labels: { app: cache }
    spec:
      containers:
        - name: cache
          image: busybox:1.36
          command: ["sh", "-c", "echo warming cache; head -c 256m /dev/zero | tail > /dev/null; sleep 3600"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 24Mi }
---
# 3. ImagePullBackOff: the tag does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:0.0.0-does-not-exist
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 16Mi }
---
# 4. CreateContainerConfigError: the referenced ConfigMap was never created.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - configMapRef:
                name: worker-config
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 16Mi }
---
# 5. Pending: the pod requests more memory than any node has.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: reports }
  template:
    metadata:
      labels: { app: reports }
    spec:
      containers:
        - name: reports
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: 10m, memory: 512Gi }
            limits: { memory: 512Gi }
---
# 6. Readiness probe failure: the probe targets a path the server does not serve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 1
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 16Mi }
