# Minimal read-only permissions for running k8s-sre-agent inside a cluster
# (for example as a CronJob or from a CI runner). The agent never writes to the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-sre-agent
  namespace: k8s-sre-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-sre-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-sre-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-sre-agent-readonly
subjects:
  - kind: ServiceAccount
    name: k8s-sre-agent
    namespace: k8s-sre-agent
