[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "k8s-sre-agent"
dynamic = ["version"]
description = "Read-only Kubernetes incident diagnosis: deterministic detectors plus optional LLM root cause analysis (Anthropic, OpenAI-compatible or Ollama)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Omar Yousfi" }]
keywords = ["kubernetes", "sre", "root-cause-analysis", "incident", "llm", "devops", "troubleshooting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "kubernetes>=31.0.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.6.0"]
dev = [
  "anthropic>=1.6.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.2",
  "twine>=6.0",
]

[project.scripts]
k8s-sre-agent = "k8s_sre_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Sudo-oy/k8s-sre-agent"
Repository = "https://github.com/Sudo-oy/k8s-sre-agent"
Issues = "https://github.com/Sudo-oy/k8s-sre-agent/issues"

[tool.hatch.version]
path = "src/k8s_sre_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_sre_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "demo", "deploy", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"demo/**" = ["S101", "T201"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["kubernetes.*", "anthropic.*"]
ignore_missing_imports = true
