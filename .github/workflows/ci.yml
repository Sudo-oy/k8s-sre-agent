name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff format
        run: ruff format --check .
      - name: ruff check
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=k8s_sre_agent --cov-report=term-missing

  build:
    name: Build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/k8s-sre-agent version
          /tmp/smoke/bin/k8s-sre-agent diagnose --from-snapshot tests/fixtures/incident-snapshot.json --fail-on never
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: bandit (static analysis)
        run: |
          pip install bandit
          bandit -r src -q
      - name: pip-audit (dependency vulnerabilities)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e ".[anthropic]"
          pip-audit --skip-editable
      - name: gitleaks (secrets in git history)
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --verbose

  e2e:
    name: End-to-end demo on kind
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Run demo scenario
        run: ./demo/run-demo.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-report
          path: demo/out/
          if-no-files-found: ignore
